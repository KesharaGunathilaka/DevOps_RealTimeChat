# Local full stack, built from source. Mirrors docker-compose.prod.yml.
#   docker compose up --build   ->   http://localhost:3000
name: unichat-local

services:
  mongo:
    image: mongo:7
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.runCommand({ ping: 1 }).ok"]
      interval: 5s
      timeout: 5s
      retries: 12

  backend:
    build: ./backend
    environment:
      MONGO: mongodb://mongo:27017/realtimechat
      PORT: "5000"
      NODE_ENV: production
      COOKIE_SECURE: "false"
      ORIGIN: http://localhost:3000
      JWT_SECRET: ${JWT_SECRET:-local-dev-only-secret}
      CLOUDINARY_CLOUD_NAME: ${CLOUDINARY_CLOUD_NAME:-}
      CLOUDINARY_API_KEY: ${CLOUDINARY_API_KEY:-}
      CLOUDINARY_API_SECRET: ${CLOUDINARY_API_SECRET:-}
    depends_on:
      mongo:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:5000/api/health"]
      interval: 5s
      timeout: 5s
      retries: 12

  frontend:
    build: ./frontend
    ports:
      - "3000:80"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  mongo-data:
