# Configures a freshly provisioned EC2 instance and deploys UniChat on it.
#
# Inventory : inventory_generated.ini, written by Terraform
# Secrets   : read from the controller's environment (Jenkins credentials),
#             never stored in this repository
- name: Deploy UniChat to EC2
  hosts: ec2
  become: true
  gather_facts: false

  vars:
    app_dir: /opt/unichat
    dockerhub_user: "{{ lookup('env', 'DOCKERHUB_USER') | default('kesharagunathilaka', true) }}"
    required_secrets:
      - JWT_SECRET
      - CLOUDINARY_CLOUD_NAME
      - CLOUDINARY_API_KEY
      - CLOUDINARY_API_SECRET

  tasks:
    - name: Fail fast if a secret was not passed in
      ansible.builtin.assert:
        that: lookup('env', item) | length > 0
        fail_msg: "{{ item }} is not set; add it as a Jenkins credential"
        quiet: true
      loop: "{{ required_secrets }}"
      run_once: true

    # The instance was created moments ago by Terraform; sshd may not be up yet.
    - name: Wait for SSH on the new instance
      ansible.builtin.wait_for_connection:
        timeout: 300

    - name: Gather facts
      ansible.builtin.setup:

    # On first boot cloud-init runs apt itself and holds the dpkg lock.
    - name: Wait for cloud-init to finish
      ansible.builtin.command: cloud-init status --wait
      changed_when: false

    - name: Install Docker and the Compose plugin
      ansible.builtin.apt:
        name:
          - docker.io
          - docker-compose-v2
        state: present
        update_cache: true
        lock_timeout: 300

    - name: Ensure Docker is running and starts on boot
      ansible.builtin.service:
        name: docker
        state: started
        enabled: true

    # A t3.micro has 1 GB of RAM; swap keeps MongoDB + Node + nginx from being OOM-killed.
    - name: Create a 1 GB swap file
      ansible.builtin.command: fallocate -l 1G /swapfile
      args:
        creates: /swapfile
      register: swapfile

    - name: Enable swap
      ansible.builtin.shell: chmod 600 /swapfile && mkswap /swapfile && swapon /swapfile
      when: swapfile.changed

    - name: Persist swap across reboots
      ansible.builtin.lineinfile:
        path: /etc/fstab
        line: /swapfile none swap sw 0 0

    - name: Create the app directory
      ansible.builtin.file:
        path: "{{ app_dir }}"
        state: directory
        mode: "0750"

    - name: Copy the production Compose file
      ansible.builtin.copy:
        src: "{{ playbook_dir }}/../docker-compose.prod.yml"
        dest: "{{ app_dir }}/docker-compose.yml"
        mode: "0640"

    - name: Write the environment file
      ansible.builtin.copy:
        dest: "{{ app_dir }}/.env"
        mode: "0600"
        content: |
          DOCKERHUB_USER={{ dockerhub_user }}
          NODE_ENV=production
          COOKIE_SECURE=false
          ORIGIN=http://{{ inventory_hostname }}
          JWT_SECRET={{ lookup('env', 'JWT_SECRET') }}
          CLOUDINARY_CLOUD_NAME={{ lookup('env', 'CLOUDINARY_CLOUD_NAME') }}
          CLOUDINARY_API_KEY={{ lookup('env', 'CLOUDINARY_API_KEY') }}
          CLOUDINARY_API_SECRET={{ lookup('env', 'CLOUDINARY_API_SECRET') }}
      no_log: true

    # Idempotent: re-running replaces containers with the latest images
    # instead of failing on "container name already in use".
    - name: Pull the latest images and start the stack
      ansible.builtin.command: >
        docker compose up -d --pull always --remove-orphans --wait --wait-timeout 300
      args:
        chdir: "{{ app_dir }}"
      changed_when: true

    - name: Smoke test through nginx
      ansible.builtin.uri:
        url: http://localhost/api/health
        status_code: 200
      register: health
      retries: 20
      delay: 5
      until: health.status == 200

    - name: Report the app URL
      ansible.builtin.debug:
        msg: "UniChat is live at http://{{ inventory_hostname }}"
