server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Image messages are sent as base64 JSON; match the API's 10 MB limit.
    client_max_body_size 10m;

    # Resolve "backend" through Docker's DNS at request time rather than at
    # startup, so nginx does not crash if the API container is still booting.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $backend http://backend:5000;

    location /api/ {
        proxy_pass $backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Socket.IO needs the HTTP Upgrade handshake to switch to WebSocket.
    location /socket.io/ {
        proxy_pass $backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 1h;
    }

    # Client-side routing: unknown paths fall back to the SPA entry point.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
